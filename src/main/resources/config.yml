# Optional arena spawn saved by /has setspawn.
# If unset, the plugin uses the world's normal spawn location.
arena: {}

game:
  durationTicks: 12000
  seekerCount: 3
  seekerReleaseDelayTicks: 600

player:
  hp: 2000
  mp: 2000
  hpRegenPerTick: 5
  mpRegenPerTick: 10
  damagePerHit: 400
  seekerDamageTakenScale: 0.5
  vanillaDamageScale: 100.0
  minVanillaDamage: 40
  airExtraDrainPerTick: 6
  airDamage: 120
  airDamageIntervalTicks: 10

abilities:
  disguise:
    range: 15
    rotationSnapDegrees: 22.5
    blacklist:
      - minecraft:water
      - minecraft:lava
      - minecraft:enchanting_table
      - minecraft:spore_blossom
      - minecraft:vine
      - minecraft:hanging_roots
      - minecraft:pitcher_crop
      - minecraft:cocoa
      - minecraft:bell
      - minecraft:ladder
      - minecraft:decorated_pot
      - minecraft:tripwire
      - minecraft:piston
      - minecraft:sticky_piston
      - minecraft:piston_head
      - minecraft:end_portal
      - minecraft:nether_portal
      - '#minecraft:banners'
      - '#minecraft:doors'
      - '#minecraft:heads'
      - '#minecraft:tall_flowers'
      - '#minecraft:all_signs'
      - '#minecraft:beds'
      - '#minecraft:buttons'
      - minecraft:snow
      - '#minecraft:rails'
      - minecraft:tripwire_hook
      - minecraft:redstone_wire
  decoy:
