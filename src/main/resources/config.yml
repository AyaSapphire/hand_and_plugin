    unlockMinTicks: 8
    unlockFallbackTicks: 100
  flyHider:
    mp: 1600
    power: 2.15
    minYBoost: 0.5
  flySeeker:
    mp: 300
    power: 1.8
    minYBoost: 0.5
  attackBullet:
