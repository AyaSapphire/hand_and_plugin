    resultDelayTicks: 20
  taunt:
    fireworkCooldownTicks: 1200
    lightningCooldownTicks: 1200
    fireworkTimeReductionTicks: 300
    lightningTimeReductionTicks: 160

worldBorder:
  initialSize: 128.0
  initialWidth: 128.0
  initialDepth: 64.0
  finalSize: 40.0
