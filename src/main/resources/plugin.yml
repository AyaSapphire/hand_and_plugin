name: hide_and_seek
version: '${version}'

main: cn.xducraft.hide_and_seek.Hide_and_seek
api-version: '1.21.11'
load: POSTWORLD
commands:
  has:
    description: Hide and Seek game command
    usage: /has <help|start|stop|setspawn|status|reload|settings>
    aliases:
      - hideandseek
      - hs
permissions:
  hide_and_seek.admin:
    description: Allows controlling Hide and Seek games
    default: op
