name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example, 1.0.0)
        required: true
        type: string
      java_version:
        description: Java major version; if omitted, use gradle.properties
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Resolve Java version
        id: resolve_java_version
        env:
          REQUESTED_JAVA_VERSION: ${{ inputs.java_version }}
        shell: bash
        run: |
          if [[ -n "$REQUESTED_JAVA_VERSION" ]]; then
            java_version="$REQUESTED_JAVA_VERSION"
          else
            java_version="$(sed -n 's/^javaVersion[[:space:]]*=[[:space:]]*//p' gradle.properties | head -n 1 | tr -d '[:space:]')"
          fi

          if [[ ! "$java_version" =~ ^[0-9]+$ ]]; then
            echo "::error::Java version must be a numeric major version."
            exit 1
          fi

          echo "Using Java $java_version"
          echo "version=$java_version" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.resolve_java_version.outputs.version }}
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release artifact
        env:
          JAVA_VERSION: ${{ steps.resolve_java_version.outputs.version }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: bash gradlew build "-PjavaVersion=${JAVA_VERSION}" "-Pversion=${RELEASE_VERSION}"

      - name: Create prerelease and tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: >-
          gh release create "v${RELEASE_VERSION}" build/libs/*.jar
          --target "${GITHUB_SHA}"
          --title "v${RELEASE_VERSION}"
          --prerelease
          --generate-notes
